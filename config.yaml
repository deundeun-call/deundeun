# 든든콜 설정값 — 여기 있는 숫자를 코드에 직접 박지 마라 (CLAUDE.md 참고)
# 아래 값은 실측값으로 기획서에 실려 제출됨. 바꾸려면 사람에게 먼저 물어라.

exposure:
  enter: 70          # 위험 진입 임계
  exit: 55           # 해제 임계 (히스테리시스)
  boost_high: 45     # 언어 top/high 가산
  boost_mid: 20      # 언어 mid 가산
  sustain_s: 10      # 지속 조건 (초)
  yellow: 50         # 노랑 표시 기준
  cooldown_s: 30     # 알림 간격 (8/25 확정)
  ewma_alpha: 0.3    # 평활 계수. 첫 유효 점수로 초기화(warm start)

rag:
  tau: 0.568                       # 이보다 낮으면 LLM 미호출
  chunk_size: 300                  # 조각 목표 길이 (자)
  chunk_tolerance: 100             # 위 길이 ±허용치 — 이 안에서 문장 경계를 찾아 자른다
  chunk_overlap: 50                # 다음 조각과 겹치는 길이 (자)
  embed_model: BAAI/bge-m3         # ingest.py·search.py가 함께 읽는 임베딩 모델 이름
  embed_model_dir: data/models/bge-m3   # 최초 다운로드 후 저장되는 로컬 경로 (행사장 오프라인 대비)
  persist_dir: data/chroma         # chromadb PersistentClient 경로
  collection: deundeun             # chromadb 컬렉션 이름

acoustic:
  win_s: 5.0         # 8/8 실측과 같은 창
  hop_s: 1.0         # 홉
